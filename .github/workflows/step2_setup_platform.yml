name: 'Step 2: Setup Platform'

on:
  workflow_dispatch:
    inputs:
      prepopulate_dependencies:
        description: 'Pre-populate dependency caches for faster builds'
        required: false
        type: boolean
        default: true

env:
  JF_URL: ${{ vars.JFROG_URL }}
  JF_ACCESS_TOKEN: ${{ secrets.JFROG_ADMIN_TOKEN }}
  JFROG_URL: ${{ vars.JFROG_URL }}
  JFROG_ADMIN_TOKEN: ${{ secrets.JFROG_ADMIN_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_REPOSITORY_OWNER: ${{ github.repository_owner }}

# FIXME: Verify these settings
concurrency:
  group: platform-operations-${{ vars.PROJECT_KEY }}
  cancel-in-progress: false

jobs:
  setup-globals:
    runs-on: ubuntu-latest
    name: Setup Global Remotes Project
    env:
      # FIXME: Should probably make multiple project key variables
      PROJECT_KEY: "bvglobals"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        with:
          version: 2.121.0

      - name: Validate Inputs
        env:
          JFROG_URL: ${{ vars.JFROG_URL }}
          JFROG_ADMIN_TOKEN: ${{ secrets.JFROG_ADMIN_TOKEN }}
          #PROJECT_KEY: ${{ vars.PROJECT_KEY }}
        run: |
          # Validate the JFrog URL
          if [[ -z "${JFROG_URL}" ]]; then
            echo "ERROR: JFROG_URL variable not set."
            exit 1
          fi
          
          # Validate the JFrog Admin Token
          if [[ -z "${JFROG_ADMIN_TOKEN}" ]]; then
            echo "ERROR: JFROG_ADMIN_TOKEN secret not set."
            exit 1
          fi
          
          # Validate the JFrog Project Key
          if [[ -z "${PROJECT_KEY}" ]]; then
            echo "ERROR: PROJECT_KEY variable not set."
            exit 1
          fi
          
          # Validate the GitHub Token
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "ERROR: GH_TOKEN secret not set."
            exit 1
          fi

      - name: Verify JFrog Platform Connectivity
        run: |
          echo "Checking JFrog Platform access from the JF CLI."
          jf rt ping

      - name: Create Projects
        run: |
          python ./scripts/create_project.py "${PROJECT_KEY}" "BookVerse Global Remotes"

      # Create the global remote repos

  setup-golden-images:
    runs-on: ubuntu-latest
    name: Setup Golden Images Project
    env:
      # FIXME: Should probably make multiple project key variables
      PROJECT_KEY: "bvgi"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        with:
          version: 2.121.0

      - name: Validate Inputs
        env:
          JFROG_URL: ${{ vars.JFROG_URL }}
          JFROG_ADMIN_TOKEN: ${{ secrets.JFROG_ADMIN_TOKEN }}
          #PROJECT_KEY: ${{ vars.PROJECT_KEY }}
        run: |
          # Validate the JFrog URL
          if [[ -z "${JFROG_URL}" ]]; then
            echo "ERROR: JFROG_URL variable not set."
            exit 1
          fi
          
          # Validate the JFrog Admin Token
          if [[ -z "${JFROG_ADMIN_TOKEN}" ]]; then
            echo "ERROR: JFROG_ADMIN_TOKEN secret not set."
            exit 1
          fi
          
          # Validate the JFrog Project Key
          if [[ -z "${PROJECT_KEY}" ]]; then
            echo "ERROR: PROJECT_KEY variable not set."
            exit 1
          fi
          
          # Validate the GitHub Token
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "ERROR: GH_TOKEN secret not set."
            exit 1
          fi

      - name: Verify JFrog Platform Connectivity
        run: |
          echo "Checking JFrog Platform access from the JF CLI."
          jf rt ping

      - name: Create Projects
        run: |
          python ./scripts/create_project.py "${PROJECT_KEY}" "BookVerse Golden Images"

      - name: Create Lifecycle Stages
        run: |
          python ./scripts/create_lifecycle_stage.py "DEV"

      # Create the remote repos for the Alpine Packages & Python packages

      - name: Create Local Repositories
        run: |
          # FIXME: How to handled the "public" prod/release repository?
          python ./scripts/create_local_repository.py "golden" "docker" "DEV"
          python ./scripts/create_local_repository.py "golden" "docker" "PROD"

      - name: Create Remote Repositories
        run: |
          python ./scripts/create_remote_repository.py "pypi" "https://pypi.org" --pypi_registry_url "https://pypi.org/simple"
          python ./scripts/create_remote_repository.py "alpine" "https://dl-cdn.alpinelinux.org/alpine"

  setup-bookverse:
    runs-on: ubuntu-latest
    name: Setup BookVerse Project
    env:
      # FIXME: Should probably make multiple project key variables
      PROJECT_KEY: ${{ vars.PROJECT_KEY }}
      COMPONENTS: "checkout helm infra inventory platform recommendations web"
      COMPONENTS_DOCKER: "checkout inventory platform recommendations web"
      COMPONENTS_GENERIC: "checkout helm infra inventory platform recommendations web"
      COMPONENTS_HELM: "helm"
      COMPONENTS_NPM: "web"
      COMPONENTS_PYPI: "checkout infra inventory platform recommendations"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        with:
          version: 2.121.0

      - name: Validate Inputs
        env:
          JFROG_URL: ${{ vars.JFROG_URL }}
          JFROG_ADMIN_TOKEN: ${{ secrets.JFROG_ADMIN_TOKEN }}
          #PROJECT_KEY: ${{ vars.PROJECT_KEY }}
        run: |
          # Validate the JFrog URL
          if [[ -z "${JFROG_URL}" ]]; then
            echo "ERROR: JFROG_URL variable not set."
            exit 1
          fi
          
          # Validate the JFrog Admin Token
          if [[ -z "${JFROG_ADMIN_TOKEN}" ]]; then
            echo "ERROR: JFROG_ADMIN_TOKEN secret not set."
            exit 1
          fi
          
          # Validate the JFrog Project Key
          if [[ -z "${PROJECT_KEY}" ]]; then
            echo "ERROR: PROJECT_KEY variable not set."
            exit 1
          fi
          
          # Validate the GitHub Token
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "ERROR: GH_TOKEN secret not set."
            exit 1
          fi

      - name: Verify JFrog Platform Connectivity
        run: |
          echo "Checking JFrog Platform access from the JF CLI."
          jf rt ping

      - name: Create Projects
        run: |
          python ./scripts/create_project.py "${PROJECT_KEY}" "BookVerse"

      - name: Create Lifecycle Stages
        run: |
          python ./scripts/create_lifecycle_stage.py "DEV"
          python ./scripts/create_lifecycle_stage.py "QA"
          python ./scripts/create_lifecycle_stage.py "STAGING"
          # NOTE: PROD is a global stage that always exists.  It's also a release stage, so it's special.
          # FIXME: Setup the Lifecycle stage plan / order

      - name: Create Local Repositories
        run: |
          # FIXME: Make sure that all of these repositories are being used.
          # Checkout Service: docker, generic, pypi
          python ./scripts/create_local_repository.py "checkout" "docker" "DEV"
          python ./scripts/create_local_repository.py "checkout" "docker" "QA"
          python ./scripts/create_local_repository.py "checkout" "docker" "STAGING"
          python ./scripts/create_local_repository.py "checkout" "docker" "PROD"
          python ./scripts/create_local_repository.py "checkout" "generic" "DEV"
          python ./scripts/create_local_repository.py "checkout" "generic" "QA"
          python ./scripts/create_local_repository.py "checkout" "generic" "STAGING"
          python ./scripts/create_local_repository.py "checkout" "generic" "PROD"
          python ./scripts/create_local_repository.py "checkout" "pypi" "DEV"
          python ./scripts/create_local_repository.py "checkout" "pypi" "QA"
          python ./scripts/create_local_repository.py "checkout" "pypi" "STAGING"
          python ./scripts/create_local_repository.py "checkout" "pypi" "PROD"
          
          # Helm Service: generic, helm
          python ./scripts/create_local_repository.py "helm" "generic" "DEV"
          python ./scripts/create_local_repository.py "helm" "generic" "QA"
          python ./scripts/create_local_repository.py "helm" "generic" "STAGING"
          python ./scripts/create_local_repository.py "helm" "generic" "PROD"
          python ./scripts/create_local_repository.py "helm" "helm" "DEV"
          python ./scripts/create_local_repository.py "helm" "helm" "QA"
          python ./scripts/create_local_repository.py "helm" "helm" "STAGING"
          python ./scripts/create_local_repository.py "helm" "helm" "PROD"
          
          # Infra Service: generic, pypi
          python ./scripts/create_local_repository.py "infra" "generic" "DEV"
          python ./scripts/create_local_repository.py "infra" "generic" "QA"
          python ./scripts/create_local_repository.py "infra" "generic" "STAGING"
          python ./scripts/create_local_repository.py "infra" "generic" "PROD"
          python ./scripts/create_local_repository.py "infra" "pypi" "DEV"
          python ./scripts/create_local_repository.py "infra" "pypi" "QA"
          python ./scripts/create_local_repository.py "infra" "pypi" "STAGING"
          python ./scripts/create_local_repository.py "infra" "pypi" "PROD"
          
          # Inventory Service: docker, generic, pypi
          python ./scripts/create_local_repository.py "inventory" "docker" "DEV"
          python ./scripts/create_local_repository.py "inventory" "docker" "QA"
          python ./scripts/create_local_repository.py "inventory" "docker" "STAGING"
          python ./scripts/create_local_repository.py "inventory" "docker" "PROD"
          python ./scripts/create_local_repository.py "inventory" "generic" "DEV"
          python ./scripts/create_local_repository.py "inventory" "generic" "QA"
          python ./scripts/create_local_repository.py "inventory" "generic" "STAGING"
          python ./scripts/create_local_repository.py "inventory" "generic" "PROD"
          python ./scripts/create_local_repository.py "inventory" "pypi" "DEV"
          python ./scripts/create_local_repository.py "inventory" "pypi" "QA"
          python ./scripts/create_local_repository.py "inventory" "pypi" "STAGING"
          python ./scripts/create_local_repository.py "inventory" "pypi" "PROD"
          
          # Platform Service: docker, generic, pypi
          python ./scripts/create_local_repository.py "platform" "docker" "DEV"
          python ./scripts/create_local_repository.py "platform" "docker" "QA"
          python ./scripts/create_local_repository.py "platform" "docker" "STAGING"
          python ./scripts/create_local_repository.py "platform" "docker" "PROD"
          python ./scripts/create_local_repository.py "platform" "generic" "DEV"
          python ./scripts/create_local_repository.py "platform" "generic" "QA"
          python ./scripts/create_local_repository.py "platform" "generic" "STAGING"
          python ./scripts/create_local_repository.py "platform" "generic" "PROD"
          python ./scripts/create_local_repository.py "platform" "pypi" "DEV"
          python ./scripts/create_local_repository.py "platform" "pypi" "QA"
          python ./scripts/create_local_repository.py "platform" "pypi" "STAGING"
          python ./scripts/create_local_repository.py "platform" "pypi" "PROD"
          
          # Recommendations Service: docker, generic, pypi
          python ./scripts/create_local_repository.py "recommendations" "docker" "DEV"
          python ./scripts/create_local_repository.py "recommendations" "docker" "QA"
          python ./scripts/create_local_repository.py "recommendations" "docker" "STAGING"
          python ./scripts/create_local_repository.py "recommendations" "docker" "PROD"
          python ./scripts/create_local_repository.py "recommendations" "generic" "DEV"
          python ./scripts/create_local_repository.py "recommendations" "generic" "QA"
          python ./scripts/create_local_repository.py "recommendations" "generic" "STAGING"
          python ./scripts/create_local_repository.py "recommendations" "generic" "PROD"
          python ./scripts/create_local_repository.py "recommendations" "pypi" "DEV"
          python ./scripts/create_local_repository.py "recommendations" "pypi" "QA"
          python ./scripts/create_local_repository.py "recommendations" "pypi" "STAGING"
          python ./scripts/create_local_repository.py "recommendations" "pypi" "PROD"
          
          # Web Service: docker, generic, npm
          python ./scripts/create_local_repository.py "web" "docker" "DEV"
          python ./scripts/create_local_repository.py "web" "docker" "QA"
          python ./scripts/create_local_repository.py "web" "docker" "STAGING"
          python ./scripts/create_local_repository.py "web" "docker" "PROD"
          python ./scripts/create_local_repository.py "web" "generic" "DEV"
          python ./scripts/create_local_repository.py "web" "generic" "QA"
          python ./scripts/create_local_repository.py "web" "generic" "STAGING"
          python ./scripts/create_local_repository.py "web" "generic" "PROD"
          python ./scripts/create_local_repository.py "web" "npm" "DEV"
          python ./scripts/create_local_repository.py "web" "npm" "QA"
          python ./scripts/create_local_repository.py "web" "npm" "STAGING"
          python ./scripts/create_local_repository.py "web" "npm" "PROD"

      - name: Create Remote Repositories
        run: |
          # Create proxy repositories for npm, PyPI, and other dependency sources
          #./.github/scripts/setup/create_dependency_repos.sh
          python ./scripts/create_remote_repository.py "pypi" "https://pypi.org" --pypi_registry_url "https://pypi.org/simple"
          python ./scripts/create_remote_repository.py "npm" "https://registry.npmjs.org"
          python ./scripts/create_remote_repository.py "docker" "https://registry-1.docker.io"

#      # FIXME: Can this be converted to JF CLI?
#      # FIXME: Do we need to prepopulate the remote caches?  Or can we just let the first pull handle this?
#      - name: Pre-populate Dependencies Cache
#        if: ${{ inputs.prepopulate_dependencies }}
#        run: |
#          # Cache common dependencies to improve build performance and reliability
#          # Controlled by workflow input 'prepopulate_dependencies' (defaults to true)
#          ./.github/scripts/setup/prepopulate_dependencies.sh

      - name: Create Custom Roles
        run: |
          # Create developer, manager, and architect roles with graduated permissions
          #./.github/scripts/setup/create_roles.sh
          echo "Creating custom project roles"
          python ./scripts/create_role.py "cicd_pipeline"
          python ./scripts/create_role.py "k8s_image_pull"

      - name: Create Users
        run: |
          # Create user accounts for developers, managers, and service accounts
          #./.github/scripts/setup/create_users.sh
          echo "Creating users for components"
          for item in ${COMPONENTS}; do
            # Set secrets and variables for project users
            ROLES="developer manager pipeline"
            for role in ${ROLES}; do
              password="$(python ./scripts/gen_random_password.py)"
              useremail="${item}.${role}@bookverse.example.com"
              # Mask the secret value
              #echo "::add-mask::${password}"
              python ./scripts/create_user.py "${useremail}" "${password}" "${useremail}"
              gh variable set "${role}_username" --body "${useremail}" --repo "${GH_REPOSITORY_OWNER}/bookverse-${item}"
              gh secret set "${role}_password" --body "${password}" --repo "${GH_REPOSITORY_OWNER}/bookverse-${item}"
            done
          done

      - name: Assign Project Roles to Users
        run: |
          echo "Assigning project roles to users."
          for item in ${COMPONENTS}; do
            # for role in ${"developer manager pipeline"}; do
            python ./scripts/add_user_to_project_role.py "${item}.developer@bookverse.example.com" "Developer"
            python ./scripts/add_user_to_project_role.py "${item}.manager@bookverse.example.com" "Release Manager"
            python ./scripts/add_user_to_project_role.py "${item}.pipeline@bookverse.example.com" "cicd_pipeline"
          done

